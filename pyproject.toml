[project]
name = "terminus"
version = "0.1.0"
description = "Autonomous vulnerability intelligence and remediation recommendation agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "packaging>=24.0",
    "streamlit>=1.38",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Optional LLM-assisted research layer. Deterministic matching, scoring and
# recommendations never depend on these packages.
agent = ["llama-index-core>=0.12"]
agent-openai = ["llama-index-core>=0.12", "llama-index-llms-openai>=0.3"]
agent-anthropic = ["llama-index-core>=0.12", "llama-index-llms-anthropic>=0.6"]

[project.scripts]
terminus = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "llama-index-core>=0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: tests that call real external APIs (skipped unless TERMINUS_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "RUF001", # ambiguous unicode in strings: we deliberately test homoglyph inputs
]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100; long user-facing strings may run to 120.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
